[project]
name = "effect-server"
version = "0.1.0"
description = ""
authors = [
    {name = "Your Name",email = "you@example.com"}
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi (>=0.162.0,<0.163.0)",
    "granian[reload] (>=2.8.5,<3.0.0)",
    "toml (>=0.10.2,<0.11.0)",
    "tree-sitter (>=0.26.1,<0.27.0)",
    "tree-sitter-haskell (>=0.24.1,<0.25.0)",
    "mcp (>=1.20,<2)",
    "peewee (>=3.18,<4)",
    "httpx (>=0.28,<1)"
]

[tool.poetry]
packages = [{include = "effect_server", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
